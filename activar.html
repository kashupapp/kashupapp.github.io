<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#103B38">
<meta name="robots" content="noindex">
<title>Activando tu KashUp</title>
<link rel="icon" type="image/png" href="app/icon-verde-192.png">
<style>
:root{--brand:#103B38;--brand2:#174C47;--glow:#7FD8B6;--card:#fff;--ink:#14302D;--ink2:#55665F;--btn:#1F7A63;--bad:#C2334A}
@media (prefers-color-scheme:dark){:root{--card:#141E1B;--ink:#EAF1EE;--ink2:#AFC1BA;--bad:#F06C7E}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px 16px;
  background:radial-gradient(110% 80% at 100% 0%,color-mix(in srgb,var(--brand2) 90%,transparent),transparent 60%),
             radial-gradient(80% 60% at 0% 100%,rgba(52,165,133,.3),transparent 65%),linear-gradient(165deg,var(--brand),#0a2725)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:repeating-radial-gradient(circle at 108% -12%,transparent 0 30px,rgba(255,255,255,.06) 30px 31.5px),
             repeating-radial-gradient(circle at -12% 115%,transparent 0 34px,rgba(255,255,255,.045) 34px 35.5px)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;font-weight:800;font-size:24px;letter-spacing:-.6px;margin-bottom:22px}
.logo svg{width:42px;height:42px}.logo em{font-style:normal;color:var(--glow)}
.card{width:100%;max-width:380px;background:var(--card);border-radius:24px;padding:32px 26px;text-align:center;box-shadow:0 30px 60px -24px rgba(0,0,0,.55);animation:sube .5s cubic-bezier(.2,.8,.2,1)}
@keyframes sube{from{opacity:0;transform:translateY(16px)}}
.ic{width:76px;height:76px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--btn) 14%,transparent)}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid color-mix(in srgb,var(--btn) 25%,transparent);border-top-color:var(--btn);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.ok{background:var(--btn)} .ok svg{width:40px;height:40px} .ok path{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:traza .45s .1s ease-out forwards}
@keyframes traza{to{stroke-dashoffset:0}}
.mal{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);font-size:34px;font-weight:800}
h1{font-size:22px;letter-spacing:-.4px;margin-bottom:6px}
p{color:var(--ink2)}
.paso{font-size:14px;margin-top:10px;min-height:21px;transition:opacity .3s}
a.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:20px;border-radius:14px;background:var(--btn);color:#fff;font-weight:700;text-decoration:none}
a.sec{background:transparent;color:var(--btn);margin-top:8px;min-height:40px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ok path{stroke-dashoffset:0}}
</style>
</head>
<body>
<main>
  <div class="logo" aria-label="KashUp">
    <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#1F7A63"/><g fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"><path d="M178 132 V380"/><path d="M178 286 L338 126"/><path d="M258 126 H338 V206"/><path d="M246 248 L338 380"/></g></svg>
    <span>Kash<em>Up</em></span>
  </div>
  <section class="card" id="card" role="status" aria-live="polite">
    <div class="ic"><div class="spin"></div></div>
    <h1>Activando tu KashUp…</h1>
    <p class="paso" id="paso">Creando tu espacio</p>
  </section>
</main>
<script src="config.js"></script>
<script>
(function(){
  var API = window.KASHUP_API || '';
  var k = (location.hash.match(/k=([A-Za-z0-9]+)/) || [])[1];
  history.replaceState(null, '', location.pathname);   // la llave no se queda visible en la barra
  var card = document.getElementById('card');
  var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

  function error(msg){
    card.innerHTML = '<div class="ic mal">!</div><h1>No pudimos entrar</h1><p>'+esc(msg)+'</p>'
      + '<a class="btn" href="app/">Pedir un link nuevo</a><a class="btn sec" href="./">Ir a la página de KashUp</a>';
  }
  if(!k) return error('Este link está incompleto. Ábrelo de nuevo desde el botón de tu correo.');
  if(API.indexOf('/exec') < 0) return error('KashUp todavía se está configurando. Inténtalo en un rato.');

  var pasos = ['Creando tu espacio', 'Preparando tus categorías', 'Casi listo…'], i = 0;
  var t = setInterval(function(){ var el = document.getElementById('paso'); if(el && i < pasos.length-1) el.textContent = pasos[++i]; }, 1600);

  fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({a:'activar', k:k}), redirect:'follow'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      clearInterval(t);
      if(j.error || !j.ok) return error(j.detalle || 'Este link ya no funciona.');
      card.innerHTML = '<div class="ic ok"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 21 l7 7 l13 -15"/></svg></div>'
        + '<h1>¡Listo, '+esc(j.nombre)+'!</h1><p>Abriendo tu KashUp…</p>';
      setTimeout(function(){ location.replace('app/#k=' + k + '&n=' + encodeURIComponent(j.nombre)); }, 1300);
    })
    .catch(function(){ clearInterval(t); error('Sin conexión. Revisa tu internet y vuelve a tocar el botón del correo.'); });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KashUp">
<meta name="theme-color" content="#103B38">
<link rel="manifest" id="lnkMan" href="manifest-verde.webmanifest">
<link rel="apple-touch-icon" id="lnkApple" href="apple-touch-verde.png">
<link rel="icon" id="lnkIco" type="image/png" href="icon-verde-192.png">
<script>
/* El ícono del celular toma el color elegido en Configuración (se fija al instalar la app) */
function iconoColor(c){
  c = (c==='rosa' || c==='lila' || c==='vino') ? c : 'verde';
  document.getElementById('lnkMan').href = 'manifest-'+c+'.webmanifest';
  document.getElementById('lnkApple').href = 'apple-touch-'+c+'.png';
  document.getElementById('lnkIco').href = 'icon-'+c+'-192.png';
}
try{ iconoColor((JSON.parse(localStorage.getItem('kashup:' + (location.pathname.split('/')[1]||'') + (false ? ':prueba' : '') + ':prefs')||'{}')||{}).color); }catch(e){}
</script>
<title>KashUp</title>
<script src="../config.js"></script>
<style>
:root{
  --bg:#EDF1EF; --card:#FFFFFF; --ink:#14302D; --ink2:#55665F; --ink3:#86958F;
  --line:#DCE4E0; --track:#E4EBE7;
  --brand:#103B38; --brand2:#174C47; --on-brand:#FFFFFF; --on-brand2:#A9CBBF;
  --accent:#1F7A63; --gold:#E3A72F; --btn:#1F7A63; --on-btn:#FFFFFF; --okbar:var(--accent);
  --good:#0E7A4E; --warn:#A86A00; --warn-fill:#E5A11B; --bad:#C2334A;
  --inc:#1baf7a; --exp:#eb6834;
  --m1:#2a78d6; --m2:#eb6834; --m3:#1baf7a; --m4:#eda100; --m5:#e87ba4; --m6:#008300; --m7:#9AA5A1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1513; --card:#16201D; --ink:#EAF1EE; --ink2:#AFC1BA; --ink3:#7D8F89;
    --line:#25322E; --track:#25322E;
    --brand:#0A2825; --brand2:#123632; --on-brand2:#8FB8AA;
    --accent:#34A585; --gold:#E8B248;
    --good:#43C58C; --warn:#E5AA2E; --warn-fill:#C98500; --bad:#F06C7E;
    --inc:#199e70; --exp:#d95926;
    --m1:#3987e5; --m2:#d95926; --m3:#199e70; --m4:#c98500; --m5:#d55181; --m6:#008300; --m7:#5E6B67;
  }
}
:root[data-theme="dark"]{color-scheme:dark;
    --bg:#0D1513; --card:#16201D; --ink:#EAF1EE; --ink2:#AFC1BA; --ink3:#7D8F89;
    --line:#25322E; --track:#25322E;
    --brand:#0A2825; --brand2:#123632; --on-brand2:#8FB8AA;
    --accent:#34A585; --gold:#E8B248;
    --good:#43C58C; --warn:#E5AA2E; --warn-fill:#C98500; --bad:#F06C7E;
    --inc:#199e70; --exp:#d95926;
    --m1:#3987e5; --m2:#d95926; --m3:#199e70; --m4:#c98500; --m5:#d55181; --m6:#008300; --m7:#5E6B67;
}
:root[data-theme="light"]{color-scheme:light}

/* Paletas de color adicionales: rosa pastel y lila (claro y oscuro) */
:root[data-color="rosa"]{
  --bg:#FBF1F4; --card:#FFFFFF; --ink:#3A2230; --ink2:#7A5A68; --ink3:#A68D98; --line:#F0DCE3; --track:#F6E6EC;
  --brand:#F6CFDC; --brand2:#EDB8CA; --on-brand:#4A1F33; --on-brand2:#8A4F66; --accent:#C24D7A; --btn:#C2507C; --okbar:#4FAF94;
}
:root[data-color="lila"]{
  --bg:#F4F1FB; --card:#FFFFFF; --ink:#2B2340; --ink2:#665C80; --ink3:#958CAD; --line:#E2DCF0; --track:#EAE5F5;
  --brand:#DCD0F5; --brand2:#C9B9EE; --on-brand:#2E2052; --on-brand2:#6B5A99; --accent:#7356BE; --btn:#7A5CC4;
}
@media (prefers-color-scheme:dark){
  :root[data-color="rosa"]:not([data-theme="light"]){
    --bg:#1A1216; --card:#241A1F; --ink:#F6E9EE; --ink2:#CDB3BE; --ink3:#9A8390; --line:#3A2A31; --track:#3A2A31;
    --brand:#3D2330; --brand2:#4F2D3E; --on-brand:#FFFFFF; --on-brand2:#E7B9CB; --accent:#F29BBB; --btn:#C2507C; --okbar:#6FD0B2;
  }
  :root[data-color="lila"]:not([data-theme="light"]){
    --bg:#14121B; --card:#1D1A27; --ink:#EEEAF7; --ink2:#BEB5D6; --ink3:#8D85A6; --line:#2E2A3D; --track:#2E2A3D;
    --brand:#2A2240; --brand2:#3A2E57; --on-brand:#FFFFFF; --on-brand2:#C7B8F0; --accent:#B39CF0; --btn:#7A5CC4;
  }
}
:root[data-color="rosa"][data-theme="dark"]{
  --bg:#1A1216; --card:#241A1F; --ink:#F6E9EE; --ink2:#CDB3BE; --ink3:#9A8390; --line:#3A2A31; --track:#3A2A31;
  --brand:#3D2330; --brand2:#4F2D3E; --on-brand:#FFFFFF; --on-brand2:#E7B9CB; --accent:#F29BBB; --btn:#C2507C; --okbar:#6FD0B2;
}
:root[data-color="lila"][data-theme="dark"]{
  --bg:#14121B; --card:#1D1A27; --ink:#EEEAF7; --ink2:#BEB5D6; --ink3:#8D85A6; --line:#2E2A3D; --track:#2E2A3D;
  --brand:#2A2240; --brand2:#3A2E57; --on-brand:#FFFFFF; --on-brand2:#C7B8F0; --accent:#B39CF0; --btn:#7A5CC4;
}
/* Paleta Vino: rojo vino con detalles dorados */
:root[data-color="vino"]{
  --bg:#FAF3F2; --card:#FFFFFF; --ink:#3A1A20; --ink2:#7A5459; --ink3:#A88A8E; --line:#F0DEDF; --track:#F5E8E8;
  --brand:#5A1522; --brand2:#73202F; --on-brand:#FFFFFF; --on-brand2:#F3C969; --accent:#8A2A3B; --btn:#7A2233; --okbar:#4FAF94; --logo-bg:#7A2233; --logo-k:#F3C969;
}
@media (prefers-color-scheme:dark){
  :root[data-color="vino"]:not([data-theme="light"]){
  --bg:#170E10; --card:#22161A; --ink:#F5E8EA; --ink2:#CDB0B5; --ink3:#9A7F84; --line:#3A262A; --track:#3A262A;
  --brand:#3E101A; --brand2:#561826; --on-brand:#FFFFFF; --on-brand2:#F3C969; --accent:#E8909F; --btn:#8A2A3B; --okbar:#6FD0B2; --logo-bg:#5A1522; --logo-k:#F3C969;
  }
}
:root[data-color="vino"][data-theme="dark"]{
  --bg:#170E10; --card:#22161A; --ink:#F5E8EA; --ink2:#CDB0B5; --ink3:#9A7F84; --line:#3A262A; --track:#3A262A;
  --brand:#3E101A; --brand2:#561826; --on-brand:#FFFFFF; --on-brand2:#F3C969; --accent:#E8909F; --btn:#8A2A3B; --okbar:#6FD0B2; --logo-bg:#5A1522; --logo-k:#F3C969;
}
.dot{display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:6px;vertical-align:-1px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--brand)}
body{
  background-color:var(--bg); color:var(--ink);
  /* textura de puntitos muy suave en el fondo */
  background-image:radial-gradient(color-mix(in srgb, var(--ink) 9%, transparent) 1px, transparent 1.4px);
  background-size:18px 18px;
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:520px;margin:0 auto}

/* Encabezado */
header{
  position:relative; isolation:isolate; overflow:hidden;
  background:
    radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--brand2) 85%, transparent) 0%, transparent 60%),
    radial-gradient(90% 70% at 0% 100%, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 65%),
    linear-gradient(165deg, var(--brand) 0%, color-mix(in srgb, var(--brand) 88%, #000) 100%);
  color:var(--on-brand);
  padding:calc(14px + env(safe-area-inset-top)) 16px 72px;
}
/* Relieve: anillos finos tipo topográfico + brillo suave (siguen la paleta elegida) */
header::before{
  content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:
    repeating-radial-gradient(circle at 105% -15%, transparent 0 26px, color-mix(in srgb, var(--on-brand) 7%, transparent) 26px 27.5px),
    repeating-radial-gradient(circle at -10% 120%, transparent 0 30px, color-mix(in srgb, var(--on-brand) 5%, transparent) 30px 31.5px);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 100%); mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 100%);
}
header::after{
  content:""; position:absolute; left:-20%; right:-20%; top:-60%; height:120%; z-index:-1; pointer-events:none;
  background:radial-gradient(closest-side, color-mix(in srgb, var(--on-brand) 9%, transparent), transparent);
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:800;letter-spacing:-.5px}
.marca svg{width:34px;height:34px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.marca em{font-style:normal;color:var(--on-brand2)}
.saldo small{display:block;font-size:13px;color:var(--on-brand2)}
.saldo b{font-size:22px;font-weight:600;letter-spacing:-.3px}
.ref{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:var(--brand2)}
.ref svg{width:20px;height:20px}
.ref.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:16px;padding:4px;border-radius:14px;background:var(--brand2)}
.seg button{height:40px;border-radius:10px;font-size:15px;font-weight:600;color:var(--on-brand2)}
.seg button[aria-selected="true"]{background:var(--on-brand);color:var(--brand)}
.mes{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.mes h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
.mes .nav{display:flex;gap:8px}
.mes button{width:44px;height:44px;border-radius:22px;background:var(--brand2);font-size:20px;display:grid;place-items:center}
.mes button:disabled{opacity:.35}

/* Tarjetas */
main{position:relative;z-index:1;padding:0 12px;margin-top:-56px}
.card{background:var(--card);border-radius:20px;padding:18px 16px;margin-bottom:12px;
  box-shadow:0 1px 0 color-mix(in srgb, #fff 10%, transparent) inset, 0 1px 2px rgba(0,0,0,.05), 0 8px 24px -10px color-mix(in srgb, var(--brand) 45%, rgba(0,0,0,.25))}
.card h2{font-size:17px;font-weight:600;margin-bottom:12px}
.muted{color:var(--ink2)}
.tiny{font-size:13px;color:var(--ink3)}

/* Disponible */
.hero .lab{font-size:14px;color:var(--ink2)}
.hero .big{font-size:44px;font-weight:700;letter-spacing:-1.2px;line-height:1.1;margin:2px 0 14px}
.hero .big.neg{color:var(--bad)}
.bar{position:relative;height:14px;border-radius:7px;background:var(--track);margin:26px 0 10px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--okbar)}
.bar .fill.over{background:var(--bad)}
.bar .tick{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--gold)}
.bar .tick span{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.hero .row{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2)}
.pace{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:15px}
.pace b{font-weight:600}

/* Resumen ingresos / gastos */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.trio div{background:var(--card);border-radius:16px;padding:12px 10px}
.trio small{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.trio b{display:block;font-size:16px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:4px;flex:none}

/* Categorías */
.cat{padding:10px 0;border-top:1px solid var(--line)}
.cat:first-of-type{border-top:0;padding-top:0}
.cat .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cat .n{font-weight:500}
.cat .v{font-size:14px;color:var(--ink2);white-space:nowrap}
.cat .v b{color:var(--ink);font-weight:600}
.mini{height:8px;border-radius:4px;background:var(--track);margin-top:8px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:4px;background:var(--okbar)}
.mini i.warn{background:var(--warn-fill)}
.mini i.bad{background:var(--bad)}
.flag{font-size:13px;font-weight:600;margin-top:5px}
.flag.warn{color:var(--warn)} .flag.bad{color:var(--bad)}
.more{display:block;width:100%;min-height:44px;margin-top:4px;font-size:15px;font-weight:600;color:var(--accent);text-align:center}

/* Gráfico 6 meses */
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink2);margin:-4px 0 6px}
.legend span{display:flex;align-items:center;gap:6px}
.sel{font-size:14px;color:var(--ink2);min-height:20px;margin-bottom:6px}
.sel b{color:var(--ink);font-weight:600}
svg.cols{display:block;width:100%;height:auto;overflow:visible}

/* Métodos */
.stack{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin-bottom:12px;background:var(--track)}
.stack i{display:block;height:100%}
.met{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px}
.met .sw{width:10px;height:10px;border-radius:3px;flex:none}
.met .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.met .pc{color:var(--ink3);font-size:13px;width:40px;text-align:right}
.met .am{font-weight:600;width:96px;text-align:right}

/* Movimientos */
.day{font-size:13px;font-weight:600;color:var(--ink3);text-transform:capitalize;margin:14px 0 2px}
.day:first-of-type{margin-top:0}
.mv{display:flex;align-items:center;gap:12px;padding:9px 0}
.mv .ic{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;font-size:15px;font-weight:700;flex:none;background:var(--track);color:var(--ink2)}
.mv .ic.in{background:color-mix(in srgb,var(--inc) 18%,transparent);color:var(--good)}
.mv .tx{flex:1;min-width:0}
.mv .tx b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .tx small{display:block;font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .am{font-weight:600;white-space:nowrap}
.mv .am.in{color:var(--good)}
.empty{color:var(--ink2);font-size:15px;padding:6px 0}

/* Vista anual */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.pair small{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.pair b{display:block;font-size:20px;font-weight:700;letter-spacing:-.3px;margin:2px 0}
.pair span{font-size:12px;color:var(--ink3)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;font-weight:600;color:var(--ink3);text-align:right;padding:0 0 8px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:11px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl td:first-child{font-weight:600;text-transform:capitalize}
.tbl tr[data-act]{cursor:pointer}
.tbl .neg{color:var(--bad)}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line)}
.rk{padding:9px 0;border-top:1px solid var(--line)}
.rk:first-of-type{border-top:0;padding-top:0}
.rk .t{display:flex;justify-content:space-between;gap:8px}
.rk .t span:last-child{white-space:nowrap;color:var(--ink2);font-size:14px}
.rk .t b{color:var(--ink);font-weight:600}
.rk .mini i.inc{background:var(--inc)}
.load{padding:24px 4px;color:var(--ink2);font-size:15px;text-align:center}
.sk{height:120px;border-radius:20px;background:var(--card);margin-bottom:12px;opacity:.7}
.key label{display:block;font-size:15px;color:var(--ink2);margin:6px 0 10px}
.key input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 14px}
.key button{width:100%;height:48px;border-radius:12px;background:var(--btn);color:var(--on-btn);font-weight:600;margin-top:10px}
.acts{display:flex;gap:8px;margin-left:auto}
/* Calendario por día */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{font-size:11px;font-weight:600;color:var(--ink3);text-align:center;padding-bottom:2px}
.cal button{position:relative;min-height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:transparent}
.cal button b{font-size:15px;font-weight:500;line-height:1.1}
.cal button small{font-size:10px;color:var(--ink2);line-height:1;min-height:10px}
.cal button.hoy b{font-weight:800;text-decoration:underline;text-underline-offset:3px}
.cal button.on{box-shadow:inset 0 0 0 2px var(--gold)}
.cal button:disabled{opacity:.3}
.indot{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--inc)}
.cal .indot{position:absolute;top:5px;right:6px}
.calkey{display:flex;gap:14px;font-size:12px;color:var(--ink3);margin:8px 0 2px}
.calkey span{display:flex;align-items:center;gap:6px}
.calkey .sq{width:12px;height:12px;border-radius:3px;background:color-mix(in srgb,var(--accent) 50%,var(--card))}
.daybox{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.dayt{font-size:17px;font-weight:600}
.days{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--ink2);margin:4px 0 6px}
.days b{color:var(--ink);font-weight:600}
.days b.good{color:var(--good)}
/* Configuración */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-h{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--brand);color:var(--on-brand)}
.sheet-h h2{font-size:20px;font-weight:700}
.sheet-h button{min-height:44px;padding:0 16px;border-radius:22px;background:var(--brand2);font-weight:600}
.sheet-b{padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line)}
.card .opt:nth-of-type(1),.card .tiny+.opt{border-top:0}
.opt .nm{flex:1;font-size:15px}
.opt .nm.off{color:var(--ink3)}
input.sw{-webkit-appearance:none;appearance:none;flex:none;width:50px;height:30px;border-radius:15px;background:var(--track);position:relative;cursor:pointer;transition:background .15s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
input.sw:checked{background:var(--accent)}
input.sw:checked::after{transform:translateX(20px)}
.mvb{width:40px;height:40px;border-radius:12px;background:var(--track);font-size:17px;font-weight:600}
.mvb:disabled{opacity:.3}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:4px;padding:4px;border-radius:12px;background:var(--track)}
.chips button{min-height:40px;border-radius:9px;font-size:14px;color:var(--ink2)}
.chips button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{display:block;width:100%;min-height:48px;border-radius:12px;background:var(--btn);color:var(--on-btn);font-weight:600;margin-top:8px}
.btn.sec{background:var(--track);color:var(--ink)}
.btn.danger{color:var(--bad)}
@media (prefers-reduced-motion:reduce){input.sw,input.sw::after{transition:none}}

  /* Columnas de ingresos vs gastos, con el gasto de cada mes escrito encima. serie: [{k, i, g, on, lab}] */
  function columnas(serie, bw, aria){

    for(var k=ini6;k<=fin6;k++){

    lista.slice(0,movLimit).forEach(function(r){
      var dt = new Date(r[0]), d0 = new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()).getTime();

    sec.movimientos = '<section class="card"><div class="tabs2" role="tablist">'

  /* Mensaje animado de 1.5 s al registrar, con los colores de la paleta elegida */
  function celebrar(tipo, monto, det, texto){
    var viejo = document.querySelector('.ok-ov'); if(viejo) viejo.remove();
    var o = document.createElement('div');
    o.className = 'ok-ov'; o.setAttribute('role','status'); o.setAttribute('aria-label', texto);
    o.style.setProperty('--okc', 'var(--btn)');   // sigue la paleta elegida (verde, rosa o lila)
    o.innerHTML = '<div class="ok-card"><div class="ok-ic"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 21 l7 7 l13 -15"/></svg></div>'
      + '<div class="ok-t">'+(tipo ? '¡Ingreso registrado!' : '¡Gasto registrado!')+'</div>'
      + '<div class="ok-m"><b>'+(tipo?'+ ':'')+S(monto)+'</b>'+(det ? ' · '+esc(det) : '')+'</div></div>';
    document.body.appendChild(o);
    try{ if(navigator.vibrate) navigator.vibrate(tipo ? [20,60,20] : 30); }catch(e){}
    setTimeout(function(){ o.remove(); }, 1500);

  function guardarMov(){
    if(!valido() || F.guardando) return;
    var cuerpo = {k:KEY, tipo:F.tipo, monto:montoNum(), des:F.des.trim()};
    if(F.tipo===0){ cuerpo.cat = F.cat; cuerpo.met = F.met; } else { cuerpo.fue = F.fue; cuerpo.rec = F.rec; }
    if(F.verFecha && F.fecha){ var t = new Date(F.fecha).getTime(); if(t) cuerpo.t = t; }
    var listo = function(){
      var aviso = (F.tipo===0?'Gasto':'Ingreso')+' de '+S(cuerpo.monto)+' registrado ✓';
      if(F.tipo===0) guardar('ultMet', F.met); else guardar('ultRec', F.rec);
      var det = F.tipo===0 ? F.cat : F.fue;
      F = nuevoF(F.tipo); render(); celebrar(cuerpo.tipo, cuerpo.monto, det, aviso);
    };
    if(DEMO){
      var ms = cuerpo.t || Date.now();
      D.movs.push([ms, cuerpo.tipo, cuerpo.monto, cuerpo.tipo ? cuerpo.fue : cuerpo.cat, cuerpo.tipo ? cuerpo.rec : cuerpo.met, cuerpo.des, mk(ms)]);
      listo(); return;
    }
    F.guardando = true; actualizarBoton();
    fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(cuerpo), redirect:'follow'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        F.guardando = false;
        if(j.error==='clave'){ toast('Tu clave no es válida. Ábrela con tu link personal.'); actualizarBoton(); return; }
        if(j.error){ toast('No se guardó: '+(j.detalle||'error en la hoja')); actualizarBoton(); return; }
        D = expandir(j); loadedAt = Date.now(); guardar('datos', JSON.stringify(j));
        listo();
      })
      .catch(function(){ F.guardando = false; actualizarBoton(); toast('Sin conexión: no se guardó. Inténtalo otra vez.'); });
  }

  /* Cambios de configuración: se ven al instante y se guardan en la hoja en segundo plano, en orden.
     Si cierras la app antes de que terminen, se envían la próxima vez que la abras. */
  var COLA = [], enviando = false, colaError = false;
  try{ COLA = JSON.parse(leer('cola')||'[]') || []; }catch(e){ COLA = []; }
  function enviarCambio(cuerpo, simular, okMsg, alListo){
    confirmar = '';
    if(D) simular(D.cfg);
    if(alListo) alListo();
    renderCfg(); toast(okMsg);
    if(DEMO) return;
    COLA.push(cuerpo); guardar('cola', JSON.stringify(COLA));
    procesarCola();
  }
  function escribiendo(){ var a = document.activeElement; return a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA'); }
  function procesarCola(){
    if(enviando || !COLA.length || DEMO || !KEY || API.indexOf('/exec')<0) return;
    enviando = true;
    fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({k:KEY}, COLA[0])), redirect:'follow'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        enviando = false;
        if(j.error==='clave'){ toast('Tu clave no es válida: tus cambios esperan.'); return; }
        COLA.shift(); guardar('cola', JSON.stringify(COLA));
        if(j.error){ colaError = true; toast('No se guardó en tu hoja: '+(j.detalle||'error')); }
        if(COLA.length){ procesarCola(); return; }
        // cola vacía: ahora la app muestra exactamente lo que quedó en la hoja
        if(colaError){ colaError = false; refresh(true, true); return; }
        D = expandir(j); loadedAt = Date.now(); guardar('datos', JSON.stringify(j));
        if(!escribiendo()){ if(!$('cfg').hidden) renderCfg(); else render(); }
      })
      .catch(function(){ enviando = false; toast('Sin señal: tus cambios se guardarán al volver la conexión.'); setTimeout(procesarCola, 15000); });
  }
  /* Presupuesto por mes: cfg.presH = [[categoría, mesDesde, monto]]. Un cambio vale desde ese mes en adelante. */
  function presDe(cfg, n, k){
    var h = (cfg.presH||[]).filter(function(x){ return x[0]===n; });
    if(!h.length){ var c = cfg.cats.find(function(x){ return x[0]===n; }); return c ? c[1] : 0; }
    var v = 0, best = -1;
    h.forEach(function(x){ if(x[1]<=k && x[1]>=best){ best = x[1]; v = x[2]; } });
    return v;
  }

  function llaveDe(txt){

  function refresh(silencioso, forzar){
    if(DEMO){
      if(!D) D = expandir(window.DEMO_DATA || {r:[],dic:[],cfg:{cats:[],metodos:[],fuentes:[]},gen:Date.now()});
      D.gen = Date.now(); loadedAt = Date.now();
      if(vista==='registrar') pintarSaldo(); else render();
      if(!silencioso) toast('Modo prueba: datos de ejemplo');
      return;
    }
    if(cargando) return;
    if(!KEY){ pedirClave('Ábrela desde el botón de tu correo de KashUp, o pega aquí tu link.'); return; }
    if(API.indexOf('/exec')<0){ $('app').innerHTML='<div class="load">KashUp se está configurando. Inténtalo en un rato.</div>'; return; }
    cargando = true; $('ref').classList.add('busy');
    fetch(API+'?k='+encodeURIComponent(KEY)+(forzar?'&f=1':''), {cache:'no-store', redirect:'follow'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        cargando = false; $('ref').classList.remove('busy');
        if(j.error==='clave'){ D=null; guardar('datos',''); pedirClave('La clave no es correcta. Pégala de nuevo.'); return; }

    else if(a==='catedit'){
      var cn = el.getAttribute('data-n');
      if(CE.edit===cn){ CE.edit=''; } else { CE.edit = cn; CE.nuevo = false; CE.desde = mesHoy(); var pv = presDe(D.cfg, cn, mesHoy()); CE.ceMonto = pv ? String(pv) : ''; }
      confirmar=''; renderCfg(); var qm=$('ceMonto'); if(qm) qm.focus();
    }
    else if(a==='catadd'){
      var nn = CE.ceNombre.trim(), np = parseFloat(String(CE.cePres).replace(',','.')) || 0;
      if(!nn) return toast('Escribe un nombre');
      if(D.cfg.cats.some(function(c){ return c[0].toLowerCase()===nn.toLowerCase(); })) return toast('"'+nn+'" ya existe');
      var hk = mesHoy();
      enviarCambio({a:'lista', lista:'cat', op:'agregar', valor:nn, presupuesto:np, desde:hk},
        function(c){ c.cats.push([nn, np]); (c.presH = c.presH||[]).push([nn, hk, np]); },
        '"'+nn+'" agregada ✓', function(){ CE.nuevo = false; CE.ceNombre = ''; CE.cePres = ''; CE.todas = true; });
    }
    else if(a==='catsave'){
      var en = CE.edit, em = parseFloat(String(CE.ceMonto).replace(',','.'));
      if(!(em>=0)) return toast('Escribe el presupuesto');
      em = Math.round(em*100)/100; var ed = mesHoy(), hk2 = ed;   // siempre desde el mes actual en adelante
      enviarCambio({a:'pres', cat:en, desde:ed, monto:em}, function(c){
        var H = c.presH = c.presH||[], cat = c.cats.find(function(x){ return x[0]===en; });
        if(!H.some(function(x){ return x[0]===en; })) H.push([en, 0, cat ? cat[1] : 0]);
        c.presH = H.filter(function(x){ return !(x[0]===en && x[1]>=ed); }); c.presH.push([en, ed, em]);
        if(cat) cat[1] = presDe(c, en, hk2);
      }, 'Presupuesto de '+en+' actualizado desde '+nomMes(ed)+' ✓', function(){ CE.edit = ''; });
    }
    else if(a==='addlista'){
      var l = el.getAttribute('data-l'), val = (NL['nl_'+l]||'').trim();
      if(!val) return toast('Escribe un nombre');
      if(listaDe(D.cfg, l).some(function(it){ return nombreDe(it).toLowerCase()===val.toLowerCase(); })) return toast('"'+val+'" ya existe');
      var pres = parseFloat(String(NL['np_'+l]||'').replace(',','.')) || 0;
      enviarCambio({a:'lista', lista:l, op:'agregar', valor:val, presupuesto:pres},
        function(c){ listaDe(c, l).push(l==='cat' ? [val, pres] : val); }, '"'+val+'" agregado ✓', function(){ NL['nl_'+l] = ''; NL['np_'+l] = ''; });
    }
    else if(a==='dellista'){
      var ll = el.getAttribute('data-l'), vv = el.getAttribute('data-val');
      if(confirmar!==ll+'|'+vv){ confirmar = ll+'|'+vv; renderCfg(); return; }
      enviarCambio({a:'lista', lista:ll, op:'quitar', valor:vv}, function(c){
        var arr = listaDe(c, ll), i = arr.findIndex(function(it){ return nombreDe(it)===vv; }); if(i>-1) arr.splice(i,1);
        if(ll==='cat' && c.presH) c.presH = c.presH.filter(function(x){ return x[0]!==vv; });
      }, '"'+vv+'" quitado');
    }
    else if(a==='verfecha'){ F.verFecha = true; F.fecha = localISO(new Date()); render(); var ff=$('fFecha'); if(ff) ff.focus(); }
    else if(a==='guardar'){ guardarMov(); }
    else if(a==='prev'){ if(vista==='anio') selY--; else { sel--; movLimit=5; selDia=null; } render(); }
    else if(a==='next'){ if(vista==='anio'){ if(selY<now.getFullYear()) selY++; } else if(sel<cur){ sel++; movLimit=5; selDia=null; } render(); }
    else if(a==='ym'){
      var k = +el.getAttribute('data-k'); if(k>cur) return;
      sel = k; movLimit=5; selDia = null;
      if(vista==='anio'){ vista='mes'; guardar('vista','mes'); window.scrollTo(0,0); }
      render();
    }
    else if(a==='dia'){ selDia = +el.getAttribute('data-d'); render(); }
    else if(a==='cats'){ allCats = !allCats; render(); }
    else if(a==='more'){ movLimit = movLimit>5 ? 5 : Infinity; render(); }
    else if(a==='mtab'){ movTab = el.getAttribute('data-t'); guardar('movTab', movTab); render(); }
    else if(a==='refresh'){ refresh(false, true); }
    else if(a==='cfg'){ abrirCfg(); }
    else if(a==='cfg-close'){ cerrarCfg(); }
    else if(a==='tog'){ P[v][ix][1] = el.checked ? 1 : 0; guardarPrefs(); renderCfg(); }
    else if(a==='bool'){ P[el.getAttribute('data-p')] = el.checked ? 1 : 0; guardarPrefs(); renderCfg(); }
    else if(a==='sube' || a==='baja'){
      var j = a==='sube' ? ix-1 : ix+1;
      if(j<0 || j>=P[v].length) return;
      var t = P[v][ix]; P[v][ix] = P[v][j]; P[v][j] = t;
      guardarPrefs(); renderCfg();
      var foco = document.querySelector('[data-act="'+a+'"][data-v="'+v+'"][data-i="'+j+'"]'); if(foco && !foco.disabled) foco.focus();
    }
    else if(a==='pref'){ P[el.getAttribute('data-p')] = el.getAttribute('data-val'); guardarPrefs(); renderCfg(); }
    else if(a==='reset'){
      if(confirmar!=='reset'){ confirmar='reset'; renderCfg(); return; }
      guardar('prefs',''); P = cargarPrefs(); aplicarPrefs(); confirmar=''; renderCfg(); toast('Configuración restablecida');
    }
    else if(a==='copylink'){
      var l = miLink();
      if(navigator.clipboard) navigator.clipboard.writeText(l).then(function(){ toast('Link copiado. No lo compartas: trae tu clave.'); }, function(){ prompt('Copia tu link:', l); });
      else prompt('Copia tu link:', l);
    }
    else if(a==='logout'){
      if(confirmar!=='logout'){ confirmar='logout'; renderCfg(); return; }
      guardar('clave',''); guardar('script',''); guardar('datos',''); guardar('cola',''); KEY=null; D=null; history.replaceState(null,'',location.pathname);
      try{ sessionStorage.removeItem(MEM+'clave'); sessionStorage.removeItem(MEM+'datos'); }catch(e){}
      cerrarCfg(); LOGIN.modo='entrar'; LOGIN.msg='Cerraste sesión en este equipo.'; LOGIN.err=false; pedirClave();
    }
    else if(a==='loginmodo'){ LOGIN.modo = el.getAttribute('data-m'); LOGIN.msg = ''; LOGIN.err = false; pintarLogin(); }
    else if(a==='verllave'){ var v = $('lgLlave').value, c = $('lgCorreo').value; LOGIN.ver = !LOGIN.ver; LOGIN.correo = c; pintarLogin(); $('lgLlave').value = v; }
    else if(a==='setkey'){
      var txt = ($('kIn').value||'').trim(), o = txt.indexOf('k=')>-1 ? leerLink(txt) : {k: txt.replace(/[^A-Za-z0-9]/g,'')};
      if(o.k){
        if(o.s){ guardar('script', o.s); usarScript(o.s); }
        KEY = o.k; guardar('clave', o.k); guardar('datos',''); D = null;
        history.replaceState(null,'', miLink().replace(/^[^#]*/,''));
        $('app').innerHTML='<div class="sk"></div><div class="sk"></div>'; refresh(true);
      }
    }
  });
  // Deslizar: hacia la izquierda = siguiente, hacia la derecha = anterior
  var tx = null, ty = 0;
  $('app').addEventListener('touchstart', function(e){ if(e.touches.length===1){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; } }, {passive:true});
  $('app').addEventListener('touchend', function(e){
    if(tx===null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if(Math.abs(dx) < 70 || Math.abs(dy) > 45 || (vista!=='mes' && vista!=='anio')) return;
    var b = $(dx<0 ? 'next' : 'prev'); if(b && !b.disabled) b.click();
  }, {passive:true});
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !$('cfg').hidden) cerrarCfg(); });

  // Al volver a la app después de un rato, trae lo nuevo sin que toques nada
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible' && Date.now()-loadedAt>60000) refresh(true, false);
  });

  var cache = DEMO ? null : leer('datos');
  if(cache){ try{ D = expandir(JSON.parse(cache)); }catch(e){ D = null; } }
  if(D) render();
  else $('app').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  refresh(true, false);
})();
</script>
<script>
/* Instalación como app en Android (Samsung, Chrome): guarda la app para abrir rápido */
if('serviceWorker' in navigator && location.protocol==='https:'){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
